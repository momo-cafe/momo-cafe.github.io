name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish before starting the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site
        uses: withastro/action@v3
        env:
          # Pre-launch only. The footer refuses to build while the KVK number
          # and btw-id in web/src/content/site.json are still PLACEHOLDER;
          # both are legally required on a Dutch commercial site. Delete these
          # two lines the day the real numbers land, and the guard starts
          # protecting the live site instead of being waved through.
          MOMO_ALLOW_PLACEHOLDERS: '1'
        with:
          # The Astro app is one of two siblings in this monorepo; the studio is
          # deployed separately with `npm run studio:deploy`.
          path: ./web
          # Astro 7 requires Node >=22.12; the action defaults to Node 20.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
